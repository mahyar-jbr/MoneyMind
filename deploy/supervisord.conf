; MoneyMind supervisord — runs backend (public port) + agent (loopback).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:agent]
command=uv run --frozen --no-dev uvicorn agent.serve:app --host %(ENV_AGENT_HOST)s --port %(ENV_AGENT_PORT)s
directory=/app/agent
environment=PYTHONPATH=/app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:backend]
command=uv run --frozen --no-dev uvicorn app.main:app --host 0.0.0.0 --port %(ENV_BACKEND_PORT)s
directory=/app/backend
environment=PYTHONPATH=/app/backend
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
